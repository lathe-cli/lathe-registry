name: validate

on:
  pull_request:
    paths:
      - "recipes/**"
      - "schema/**"
      - "scripts/**"
      - "site/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "recipes/**"
      - "schema/**"
      - "scripts/**"
      - "site/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to a release, not a moving ref: the gate's verdict is only meaningful
  # against a known Lathe, and it is recorded as build provenance.
  LATHE_REF: v0.5.2
  LATHE_SPECS_CACHE: ${{ github.workspace }}/.cache

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install lathe
        run: |
          go install github.com/lathe-cli/lathe/cmd/lathe@${LATHE_REF}
          lathe version

      # Pinned specs are immutable, so this hits on every run that does not change
      # a pinned_tag; without it each build re-clones every upstream repo.
      - uses: actions/cache@v4
        with:
          path: ${{ env.LATHE_SPECS_CACHE }}
          key: specs-${{ hashFiles('recipes/**/specs/sources.yaml') }}
          restore-keys: specs-

      - run: npm ci
      - run: npm --prefix site ci
      - run: npm test

      # Generates every recipe with a real Lathe, runs the admission rules
      # against the built CLI, and retains the host binary plus reviewable Skill
      # evidence. Blocking rules fail the build.
      - run: node scripts/gate.mjs --write

      - run: npm run build
      - uses: actions/configure-pages@v5
        if: github.event_name == 'push'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: site/dist
      - uses: actions/deploy-pages@v4
        if: github.event_name == 'push'
